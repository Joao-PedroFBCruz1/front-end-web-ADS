<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <tittle>Recrutamento Online</tittle>
        <meta charset="UTF-8">
    </head>
    <body>
        <header>
            <h1>Recrutamento Online</h1>
        </header>
        <main>
            <section>
                <h2>Cadestre seu currículo</h2>
                <form action="#" method="get">
                    <p>Preencha o formulário para se candidatar à vaga</p>
                    <fieldset>
                        <legend>Dados pessoais</legend>
                        <div>
                            <lable for="nome_id">Nome completo:</lable>
                            <input id="nome_id" name="nome" type="text">
                        </div>

                        <div>
                            <lable for="telefone_id">Telefone:</lable>
                            <input id="telefone_id" nome="telefone" type="tel">
                        </div>

                        <div>
                            <lable for="email_id">E-mail:</lable>
                            <input id="email_id" name="email" type="email">
                        </div>

                        <div>
                            <lable for="data_nasc_id">Data de nascimento:</lable>
                            <input id="data_nasc_id" name="data_nasc" type="date">
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Endereço</legend>
                        <div>
                            <lable for="logradouro_id">Logradrouro</lable>
                            <input id="logradouro_id" name="logradouro" type="text">
                        </div>

                        <div>
                            <lable for="cidade_id">Cidade</lable>
                            <input id="cidade_id" name="cidade" type="text">
                        </div>

                        <div>
                            <lable for="numero_id">Número:</lable>
                            <input id="numero_id" name="numero" type="number">
                        </div>
                    </fieldset>
                </form>
            </section>
        </main>
        <footer>

        </footer>
    </body>
</html>
