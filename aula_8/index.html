<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Filme - Cineclube</title>
    <link rel="stylesheet" href="./styles/global.css">
</head>
<body>

    <main class="container">
        <h1>Cadastro de Indicação de Filme</h1>
        <p class="subtitle">Preencha os dados abaixo para cadastrar o filme no sistema.</p>

        <form id="cadastroForm" novalidate>
            <div class="form-group">
                <label for="nomeCompleto">Título do Filme *</label>
                <input type="text" id="nomeCompleto" name="nomeCompleto" placeholder="Ex: Interestelar">
                <span class="error-message" id="erro-nomeCompleto"></span>
            </div>

            <div class="form-group">
                <label for="email">E-mail do Indicador *</label>
                <input type="email" id="email" name="email" placeholder="seu@email.com">
                <span class="error-message" id="erro-email"></span>
            </div>

            <div class="form-group">
                <label for="cpf">Código / Registro (com máscara) *</label>
                <input type="text" id="cpf" name="cpf" maxlength="14" placeholder="000.000.000-00">
                <span class="error-message" id="erro-cpf"></span>
            </div>

            <div class="form-group">
                <label for="telefone">Telefone para Contato *</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(00) 90000-0000">
                <span class="error-message" id="erro-telefone"></span>
            </div>

            <div class="form-group">
                <label for="dataNascimento">Data de Lançamento *</label>
                <input type="date" id="dataNascimento" name="dataNascimento">
                <span class="error-message" id="erro-dataNascimento"></span>
            </div>

            <div class="form-group">
                <label for="cep">CEP da Produtora/Distribuidora *</label>
                <input type="text" id="cep" name="cep" maxlength="9" placeholder="00000-000">
                <span class="error-message" id="erro-cep"></span>
            </div>

            <div class="form-group">
                <label for="cidade">Cidade de Origem *</label>
                <input type="text" id="cidade" name="cidade" placeholder="Ex: Hollywood">
                <span class="error-message" id="erro-cidade"></span>
            </div>

            <div class="form-group">
                <label for="estado">País / Região (UF) *</label>
                <select id="estado" name="estado">
                    <option value="">Selecione...</option>
                    <option value="PR">Nacional (Brasil)</option>
                    <option value="SP">Hollywood (EUA)</option>
                    <option value="RJ">Europeu</option>
                    <option value="MG">Asiático</option>
                    <option value="OUTROS">Outros</option>
                </select>
                <span class="error-message" id="erro-estado"></span>
            </div>

            <div class="form-group">
                <label for="senha">Senha de Acesso ao Acervo *</label>
                <input type="password" id="senha" name="senha" placeholder="Mínimo de 6 caracteres">
                <span class="error-message" id="erro-senha"></span>
            </div>

            <div class="form-group">
                <label for="nivelExperiencia">Gênero Principal *</label>
                <select id="nivelExperiencia" name="nivelExperiencia">
                    <option value="">Selecione...</option>
                    <option value="Iniciante">Ficção Científica</option>
                    <option value="Intermediario">Drama</option>
                    <option value="Avancado">Ação / Aventura</option>
                </select>
                <span class="error-message" id="erro-nivelExperiencia"></span>
            </div>

            <button type="submit" id="btnSubmit">Cadastrar Filme</button>
        </form>

        <div id="resultadoContainer" class="hidden">
            <h2>Retorno da API (Postman Echo):</h2>
            <pre id="jsonResultado"></pre>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
