<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width initial-scale=1.0">
        <link rel="stylesheet" href="./styles/global.css">
        <link rel="icon" href="./images/homem-aranha.png" type="image/x-icon">
        <title>Atividade display</title>
    </head>

    <body>
        <header>
            <h1>Atividade display grid/flex</h1>
        </header>

        <main>
            <section>
                <h2>Display grid</h2>
                <div class="container-grid-area">
                    <div class="item item-cabecalho">
                        <img src="./images/logo-spetacular-omiaranha.png" alt="Logo espetacular homem-aranha">
                    </div>
                    <div class="item item-artigo"><img src="./images/foto_foda_omi_aranha.png" alt="Foto Homem Aranha">
                    </div>
                    <div class="item item-texto1">
                        <img src="./images/simbolo_aranha_preto.png" alt="Símbolo preto do homem-aranha">
                    </div>
                    <div class="item item-texto2">
                        <img src="./images/simbolo_vermelho.png" alt="Símbolo vermelho do homem-aranha">
                    </div>
                    <div class="item item-principal"><img src="./images/sextextosinixtro.jpg" alt="Homem Aranha vs Sexteto Sinistro">
                    </div>
                    <div class="item item-textual">A série onde realmente mostra, que com grandes poderem existem sim grandes responsabilidades.</div>
                    <div class="item item-rodape">A melhor série do personagem já feita</div>
                </div>
            </section>

            <section>
                <h2>Display flex</h2>
                <h2>Qual seu traje favorito?</h2>
                <div class="container-flex">

                    <div class="item">Clássico</div>
                    <div class="item">Simbionte</div>
                    <div class="item">2099</div>
                    <div class="item">Ben Reilly</div>
                </div>
            </section>

            <section>
                <div class="container-flex">
                    
                    <div class="item"><img src="./images/spiderman_classico_transparente.png"></div>
                    <div class="item"><img src="./images/simbionte_transparente.png"></div>
                    <div class="item"><img src="./images/Code_Generated_Image (3).png"></div>
                    <div class="item"><img src="./images/ben_reily_transparente.png"></div>
                </div>
            </section>

        </main>
    </body>
