<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles/global.css">
    <script src="./script/index.js" defer></script>
    <title>Meus jogos</title>
</head>

<body>
    <header>
        <h1>Meus jogos</h1>
    </header>

    <main>
        <section class="container-cards">
            
            <div class="card" id="free-fire">
                <h2>Free Fire</h2>
                <p>Battle Roayale</p>
                <button onclick="marcar('free-fire', 'Free fire')">Clique</button>
            </div>

            <div class="card" id="lol">
                <h2>League of Legends</h2>
                <p>MOBA</p>
                <button onclick="marcar('lol', 'League of Legends')">Clique</button>
            </div>

            <div class="card" id="valorant">
                <h2>Valorant</h2>
                <p>Tiro tático</p>
                <button onclick="marcar('valorant', 'Valorant')">Clique</button>
            </div>

            <div class="card" id="minecraft">
                <h2>Minecraft</h2>
                <p>Sandbox</p>
                <button onclick="marcar('minecraft', 'Minecraft')">Clique</button>
            </div>

            <div class="card" id="fortnite">
                <h2>Fortnite</h2>
                <p>Battle Roayale</p>
                <button onclick="marcar('fortnite', 'Fortnite')">Clique</button>
            </div>

            <div class="card" id="fifa">
                <h2>Fifa</h2>
                <p>Futebol</p>
                <button onclick="marcar('fifa', 'Fifa')">Clique</button>
            </div>

        </section>
    </main>

    <footer>
        <p>Projeto para conhecermos media queries e localStorage</p>
    </footer>
</body>
</html>
